name: Build & Publish

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types: published
  workflow_dispatch:

jobs:
  build-wheel:
    strategy:
      matrix:
        include:
          - arch: windows_x86_64
            runs-on: windows-latest
          - arch: linux_x86_64
            runs-on: ubuntu-latest
          - arch: linux_aarch64
            runs-on: ubuntu-24.04-arm
          - arch: macosx_x86_64
            runs-on: macos-26-intel
          - arch: macosx_arm64
            runs-on: macos-26
      fail-fast: false

    runs-on: ${{ matrix.runs-on }}
    name: Build wheels on ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0

      - uses: actions/upload-artifact@v7
        with:
          name: vapoursynth-descale-wheels-${{ matrix.runs-on }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: vapoursynth-descale-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheel, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: vapoursynth-descale-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
